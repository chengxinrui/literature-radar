# 文献雷达：按用户给出的论文示例配置的第一版。
# 自动回溯最近 183 天（约 6 个月），之后由 GitHub Actions 每日增量检查。

output_dir: data
lookback_days: 183
max_results_per_query: 10
max_papers_in_feishu: 8
request_timeout_seconds: 30
status_recheck_interval_days: 30
max_arxiv_status_checks_per_run: 100

domestic_country_codes: [CN]  # 若希望德国算“国内”，改成 [DE]

sources:
  arxiv: true
  crossref: true
  openalex: true  # 需设置 OPENALEX_API_KEY；没有 key 时自动跳过 OpenAlex

feishu:
  enabled: false

topics:
  - name: "World Models 与连续时间/潜变量动力学"
    role: core
    weight: 1.0
    terms:
      - "world models"
      - "action-conditioned world model"
      - "latent dynamics"
      - "continuous-time dynamics model"
      - "latent evolution"
      - "temporal frequency principle in world models"
      - "model-based reinforcement learning"
      - "ODE world model"
    arxiv_categories: [cs.LG, cs.AI, cs.RO, stat.ML, eess.SY, math.DS, physics.comp-ph]

  - name: "Neural Combinatorial Optimization 与神经搜索"
    role: core
    weight: 1.0
    terms:
      - "neural combinatorial optimization"
      - "neural routing"
      - "autoregressive combinatorial optimization"
      - "diffusion combinatorial optimization"
      - "iterative search combinatorial optimization"
      - "reduce-then-solve combinatorial optimization"
      - "reduction-based combinatorial optimization"
      - "learning to optimize routing"
    arxiv_categories: [cs.AI, cs.LG, cs.DS, math.OC, stat.ML]

  - name: "PDE、Neural Operators、谱方法与最优控制"
    role: adjacent
    weight: 0.8
    terms:
      - "neural operator"
      - "operator learning"
      - "PDE-driven world model"
      - "learning PDE dynamics"
      - "adaptive spectral method"
      - "neural spectral method"
      - "PDE-constrained optimal control"
      - "optimal control with neural operators"
    arxiv_categories: [math.NA, math.DS, math.OC, physics.comp-ph, cs.LG, eess.SY]

  - name: "交叉探索：学到的动力学支持规划、控制与优化"
    role: exploratory
    weight: 0.5
    terms:
      - "planning with learned dynamics"
      - "planning in world models"
      - "model-based control with learned dynamics"
      - "action-conditioned predictive model"
      - "world models for optimization"
      - "PDE-constrained optimization learning"
      - "dynamics-aware combinatorial optimization"
    arxiv_categories: [cs.LG, cs.AI, cs.RO, eess.SY, math.OC, math.NA, physics.comp-ph]

# Awesome 风格目录的 venue 筛选规则。
# CCF-A / CCF-B/C 是按 CCF 人工智能目录中相关会议和期刊维护的别名表。
# 只展示 CCF-A 和下面手工列出的跨领域强 venue；已知 B/C 与未分级 venue 不进入精选 Markdown。
quality_policy:
  include_preprints: true
  ccf_reference: "CCF 官方人工智能目录（venue 表应定期复核）"
  ccf_a_venues:
    - name: "NeurIPS"
      aliases: ["NeurIPS", "Neural Information Processing Systems", "NIPS"]
    - name: "ICML"
      aliases: ["ICML", "International Conference on Machine Learning"]
    - name: "AAAI"
      aliases: ["AAAI", "AAAI Conference on Artificial Intelligence"]
    - name: "IJCAI"
      aliases: ["IJCAI", "International Joint Conference on Artificial Intelligence"]
    - name: "ACL"
      aliases: ["ACL", "Annual Meeting of the Association for Computational Linguistics"]
    - name: "CVPR"
      aliases: ["CVPR", "Computer Vision and Pattern Recognition"]
    - name: "ICCV"
      aliases: ["ICCV", "International Conference on Computer Vision"]
    - name: "Artificial Intelligence"
      aliases: ["Artificial Intelligence"]
    - name: "TPAMI"
      aliases: ["TPAMI", "Transactions on Pattern Analysis and Machine Intelligence"]
    - name: "IJCV"
      aliases: ["IJCV", "International Journal of Computer Vision"]
    - name: "JMLR"
      aliases: ["JMLR", "Journal of Machine Learning Research"]

  ccf_bc_venues:
    - name: "COLT"
      aliases: ["COLT", "Computational Learning Theory"]
    - name: "EMNLP"
      aliases: ["EMNLP", "Empirical Methods in Natural Language Processing"]
