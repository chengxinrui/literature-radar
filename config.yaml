      aliases: ["ECCV", "European Conference on Computer Vision"]
    - name: "ICRA"
      aliases: ["ICRA", "International Conference on Robotics and Automation"]
    - name: "ICAPS"
      aliases: ["ICAPS", "International Conference on Automated Planning and Scheduling"]
    - name: "UAI"
      aliases: ["UAI", "Uncertainty in Artificial Intelligence"]
    - name: "AAMAS"
      aliases: ["AAMAS", "Autonomous Agents and Multiagent Systems"]
    - name: "ECAI"
      aliases: ["ECAI", "European Conference on Artificial Intelligence"]
    - name: "AISTATS"
      aliases: ["AISTATS", "Artificial Intelligence and Statistics"]
    - name: "ACML"
      aliases: ["ACML", "Asian Conference on Machine Learning"]
    - name: "ACCV"
